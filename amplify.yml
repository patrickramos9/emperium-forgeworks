version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
# SPA: direct links like /shop and /shop/eldritch-dragon must serve index.html
customRedirects:
  - source: "/<*>"
    target: "/index.html"
    status: "200"
