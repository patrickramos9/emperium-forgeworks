version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
        - npm ci --prefix amplify --cache .npm-amplify --prefer-offline
        - npm ci --prefix amplify/functions/add-customer-to-group --cache .npm-fn-add-customer --prefer-offline
        - npm ci --prefix amplify/functions/lookup-customer-by-email --cache .npm-fn-lookup-customer --prefer-offline
        - npm ci --prefix amplify/functions/list-customers --cache .npm-fn-list-customers --prefer-offline
        - npm ci --prefix amplify/functions/get-ga4-dashboard --cache .npm-fn-ga4-dashboard --prefer-offline
        - npm ci --prefix amplify/functions/create-stripe-checkout --cache .npm-fn-stripe-checkout --prefer-offline
        - npm ci --prefix amplify/functions/stripe-webhook --cache .npm-fn-stripe-webhook --prefer-offline
        - npm ci --prefix amplify/functions/notify-order-placed --cache .npm-fn-notify-order --prefer-offline
        - npm ci --prefix amplify/functions/get-storefront-stats --cache .npm-fn-storefront-stats --prefer-offline
        - export CI=1
        - echo "pipeline-deploy branch=$AWS_BRANCH app-id=$AWS_APP_ID"
        - |
          if [ -z "$AWS_BRANCH" ] || [ -z "$AWS_APP_ID" ]; then
            echo "ERROR: AWS_BRANCH and AWS_APP_ID must be set (Amplify Hosting provides these on fullstack builds)."
            exit 1
          fi
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
      - amplify/node_modules/**/*
      - .npm-amplify/**/*
      - amplify/functions/add-customer-to-group/node_modules/**/*
      - .npm-fn-add-customer/**/*
      - amplify/functions/lookup-customer-by-email/node_modules/**/*
      - .npm-fn-lookup-customer/**/*
      - amplify/functions/list-customers/node_modules/**/*
      - .npm-fn-list-customers/**/*
      - amplify/functions/get-ga4-dashboard/node_modules/**/*
      - .npm-fn-ga4-dashboard/**/*
      - amplify/functions/create-stripe-checkout/node_modules/**/*
      - .npm-fn-stripe-checkout/**/*
      - amplify/functions/stripe-webhook/node_modules/**/*
      - .npm-fn-stripe-webhook/**/*
      - amplify/functions/notify-order-placed/node_modules/**/*
      - .npm-fn-notify-order/**/*
      - amplify/functions/get-storefront-stats/node_modules/**/*
      - .npm-fn-storefront-stats/**/*
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
# SPA: rewrite extensionless paths to index.html (200) before S3 trailing-slash 301
customRedirects:
  - source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|html|xml|webmanifest)$)([^.]+$)/>"
    target: "/index.html"
    status: "200"
  - source: "/<*>"
    target: "/index.html"
    status: "404-200"
