version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
        - npm ci --prefix amplify --cache .npm-amplify --prefer-offline
        - npm ci --prefix amplify/functions/add-customer-to-group --cache .npm-fn-add-customer --prefer-offline
        - npm ci --prefix amplify/functions/issue-new-account-grant --cache .npm-fn-issue-new-account --prefer-offline
        - npm ci --prefix amplify/functions/lookup-customer-by-email --cache .npm-fn-lookup-customer --prefer-offline
        - npm ci --prefix amplify/functions/list-customers --cache .npm-fn-list-customers --prefer-offline
        - npm ci --prefix amplify/functions/get-ga4-dashboard --cache .npm-fn-ga4-dashboard --prefer-offline
        - npm ci --prefix amplify/functions/create-stripe-checkout --cache .npm-fn-stripe-checkout --prefer-offline
        - npm ci --prefix amplify/functions/stripe-webhook --cache .npm-fn-stripe-webhook --prefer-offline
        - npm ci --prefix amplify/functions/notify-order-placed --cache .npm-fn-notify-order --prefer-offline
        - npm ci --prefix amplify/functions/get-storefront-stats --cache .npm-fn-storefront-stats --prefer-offline
        - npm ci --prefix amplify/functions/update-order-fulfillment --cache .npm-fn-update-fulfillment --prefer-offline
        - npm ci --prefix amplify/functions/update-print-line-review --cache .npm-fn-print-review --prefer-offline
        - npm ci --prefix amplify/functions/submit-print-request --cache .npm-fn-submit-print --prefer-offline
        - npm ci --prefix amplify/functions/admin-quote-print-request --cache .npm-fn-quote-print --prefer-offline
        - npm ci --prefix amplify/functions/admin-decline-print-request --cache .npm-fn-decline-print --prefer-offline
        - npm ci --prefix amplify/functions/create-print-quote-checkout --cache .npm-fn-print-quote-checkout --prefer-offline
        - npm ci --prefix amplify/functions/ensure-guest-session --cache .npm-fn-ensure-guest --prefer-offline
        - npm ci --prefix amplify/functions/merge-guest-identity --cache .npm-fn-merge-guest --prefer-offline
        - npm ci --prefix amplify/functions/guest-notifications --cache .npm-fn-guest-notifications --prefer-offline
        - npm ci --prefix amplify/functions/guest-messages --cache .npm-fn-guest-messages --prefer-offline
        - npm ci --prefix amplify/functions/cleanup-idle-carts --cache .npm-fn-cleanup-idle-carts --prefer-offline
        - export CI=1
        # ampx CDK synth/typecheck OOMs on default Amplify build heap as the backend grows
        - export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--max-old-space-size=8192"
        - echo "pipeline-deploy branch=$AWS_BRANCH app-id=$AWS_APP_ID NODE_OPTIONS=$NODE_OPTIONS"
        - |
          if [ -z "$AWS_BRANCH" ] || [ -z "$AWS_APP_ID" ]; then
            echo "ERROR: AWS_BRANCH and AWS_APP_ID must be set (Amplify Hosting provides these on fullstack builds)."
            exit 1
          fi
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
      - amplify/node_modules/**/*
      - .npm-amplify/**/*
      - amplify/functions/add-customer-to-group/node_modules/**/*
      - .npm-fn-add-customer/**/*
      - amplify/functions/issue-new-account-grant/node_modules/**/*
      - .npm-fn-issue-new-account/**/*
      - amplify/functions/lookup-customer-by-email/node_modules/**/*
      - .npm-fn-lookup-customer/**/*
      - amplify/functions/list-customers/node_modules/**/*
      - .npm-fn-list-customers/**/*
      - amplify/functions/get-ga4-dashboard/node_modules/**/*
      - .npm-fn-ga4-dashboard/**/*
      - amplify/functions/create-stripe-checkout/node_modules/**/*
      - .npm-fn-stripe-checkout/**/*
      - amplify/functions/stripe-webhook/node_modules/**/*
      - .npm-fn-stripe-webhook/**/*
      - amplify/functions/notify-order-placed/node_modules/**/*
      - .npm-fn-notify-order/**/*
      - amplify/functions/get-storefront-stats/node_modules/**/*
      - .npm-fn-storefront-stats/**/*
      - amplify/functions/update-order-fulfillment/node_modules/**/*
      - .npm-fn-update-fulfillment/**/*
      - amplify/functions/update-print-line-review/node_modules/**/*
      - .npm-fn-print-review/**/*
      - amplify/functions/submit-print-request/node_modules/**/*
      - .npm-fn-submit-print/**/*
      - amplify/functions/admin-quote-print-request/node_modules/**/*
      - .npm-fn-quote-print/**/*
      - amplify/functions/admin-decline-print-request/node_modules/**/*
      - .npm-fn-decline-print/**/*
      - amplify/functions/create-print-quote-checkout/node_modules/**/*
      - .npm-fn-print-quote-checkout/**/*
      - amplify/functions/ensure-guest-session/node_modules/**/*
      - .npm-fn-ensure-guest/**/*
      - amplify/functions/merge-guest-identity/node_modules/**/*
      - .npm-fn-merge-guest/**/*
      - amplify/functions/guest-notifications/node_modules/**/*
      - .npm-fn-guest-notifications/**/*
      - amplify/functions/guest-messages/node_modules/**/*
      - .npm-fn-guest-messages/**/*
      - amplify/functions/cleanup-idle-carts/node_modules/**/*
      - .npm-fn-cleanup-idle-carts/**/*
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
# SPA: rewrite extensionless paths to index.html (200) before S3 trailing-slash 301
customRedirects:
  - source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|html|xml|webmanifest)$)([^.]+$)/>"
    target: "/index.html"
    status: "200"
  - source: "/<*>"
    target: "/index.html"
    status: "404-200"
